<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TourHub | Complaints</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/complaints.css">

</head>

<body>

<div class="container py-5">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>

<i class="bi bi-chat-left-text-fill text-danger"></i>

Complaint Management

</h2>

<button
class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#complaintModal">

<i class="bi bi-plus-circle"></i>

New Complaint

</button>

</div>

<div class="row mb-4">

<div class="col-md-4">

<input
type="text"
class="form-control"
id="searchComplaint"
placeholder="Search Complaint">

</div>

<div class="col-md-8 text-end">

<span class="badge bg-danger p-2">
High Priority
</span>

<span class="badge bg-warning text-dark p-2">
Medium
</span>

<span class="badge bg-success p-2">
Low
</span>

</div>

</div>

<table class="table table-hover table-bordered">

<thead>

<tr>

<th>#</th>
<th>Customer</th>
<th>Complaint</th>
<th>Priority</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="complaintTable">

</tbody>

</table>

</div>

<!-- Modal -->

<div class="modal fade" id="complaintModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h4>Register Complaint</h4>

<button
class="btn-close"
data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<input
type="text"
id="customer"
class="form-control mb-3"
placeholder="Customer Name">

<textarea
id="message"
class="form-control mb-3"
rows="4"
placeholder="Complaint Details"></textarea>

<select
id="priority"
class="form-select mb-3">

<option>Low</option>
<option>Medium</option>
<option>High</option>

</select>

<select
id="status"
class="form-select">

<option>Open</option>
<option>In Progress</option>
<option>Closed</option>

</select>

</div>

<div class="modal-footer">

<button
class="btn btn-success"
id="saveComplaint">

Save Complaint

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/complaints.js"></script>

</body>

</html>
