<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TourHub | Top Destinations</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/destinations.css">

</head>

<body>

<div class="container py-5">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>

<i class="bi bi-globe-central-south-asia"></i>

Top Destinations

</h2>

<input
type="text"
class="form-control w-25"
id="searchDestination"
placeholder="Search Destination">

</div>

<div class="row" id="destinationContainer">

<!-- Maldives -->

<div class="col-lg-4 mb-4 destination">

<div class="card destination-card">

<img src="https://images.unsplash.com/photo-1573843981267-be1999ff37cd?auto=format&fit=crop&w=800&q=80"
class="card-img-top">

<div class="card-body">

<h4>Maldives</h4>

<p>

Luxury Beach Paradise

</p>

<div class="mb-2">

⭐⭐⭐⭐⭐

</div>

<h5 class="text-primary">

₹85,000

</h5>

<button
class="btn btn-primary w-100 bookBtn">

Book Now

</button>

</div>

</div>

</div>

<!-- Switzerland -->

<div class="col-lg-4 mb-4 destination">

<div class="card destination-card">

<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80"
class="card-img-top">

<div class="card-body">

<h4>Switzerland</h4>

<p>

Snow Mountains & Alps

</p>

<div>

⭐⭐⭐⭐⭐

</div>

<h5 class="text-success">

₹1,45,000

</h5>

<button
class="btn btn-success w-100 bookBtn">

Book Now

</button>

</div>

</div>

</div>

<!-- Dubai -->

<div class="col-lg-4 mb-4 destination">

<div class="card destination-card">

<img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=800&q=80"
class="card-img-top">

<div class="card-body">

<h4>Dubai</h4>

<p>

Luxury City Tour

</p>

<div>

⭐⭐⭐⭐☆

</div>

<h5 class="text-warning">

₹62,000

</h5>

<button
class="btn btn-warning w-100 bookBtn">

Book Now

</button>

</div>

</div>

</div>

</div>

</div>

<script src="js/destinations.js"></script>

</body>

</html>
