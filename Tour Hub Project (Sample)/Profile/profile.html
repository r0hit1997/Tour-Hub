<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TourHub | My Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/profile.css">

</head>

<body>

<div class="container py-5">

<div class="row">

<!-- Left Profile Card -->

<div class="col-lg-4">

<div class="profile-card">

<img id="profilePreview"
src="https://i.pravatar.cc/250?img=12"
class="profile-image">

<h3 id="displayName">

Travel Consultant

</h3>

<p class="text-muted">

Senior Tour Consultant

</p>

<input
type="file"
id="profileImage"
class="form-control mt-3">

<hr>

<div class="row text-center">

<div class="col">

<h4 id="bookingCount">

356

</h4>

<small>Bookings</small>

</div>

<div class="col">

<h4 id="ratingValue">

4.9★

</h4>

<small>Rating</small>

</div>

<div class="col">

<h4 id="revenueValue">

₹8.5L

</h4>

<small>Revenue</small>

</div>

</div>

</div>

</div>

<!-- Right Section -->

<div class="col-lg-8">

<div class="card shadow border-0">

<div class="card-header bg-primary text-white">

<h3>

Edit Profile

</h3>

</div>

<div class="card-body">

<form id="profileForm">

<div class="row">

<div class="col-md-6 mb-3">

<label>First Name</label>

<input
type="text"
id="firstName"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Last Name</label>

<input
type="text"
id="lastName"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input
type="email"
id="email"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Phone</label>

<input
type="text"
id="phone"
class="form-control">

</div>

<div class="col-md-12 mb-3">

<label>Address</label>

<textarea
id="address"
rows="4"
class="form-control"></textarea>

</div>

<div class="col-md-6 mb-3">

<label>City</label>

<input
type="text"
id="city"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Country</label>

<input
type="text"
id="country"
class="form-control">

</div>

<div class="col-md-12">

<button
class="btn btn-primary w-100"
type="submit">

Save Profile

</button>

</div>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<script src="js/profile.js"></script>

</body>

</html>
