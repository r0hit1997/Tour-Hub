<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TourHub | Consultant Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="css/register.css">

</head>

<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-10">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-header bg-primary text-white p-4">

<h2>

<i class="bi bi-person-plus-fill"></i>

Consultant Registration

</h2>

</div>

<div class="card-body p-5">

<form id="registerForm">

<div class="row">

<div class="col-md-6 mb-3">

<label>First Name</label>

<input
type="text"
class="form-control"
id="fname">

<small class="text-danger" id="fnameError"></small>

</div>

<div class="col-md-6 mb-3">

<label>Last Name</label>

<input
type="text"
class="form-control"
id="lname">

<small class="text-danger" id="lnameError"></small>

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
id="email">

<small class="text-danger" id="emailError"></small>

</div>

<div class="col-md-6 mb-3">

<label>Mobile Number</label>

<input
type="text"
class="form-control"
id="mobile">

<small class="text-danger" id="mobileError"></small>

</div>

<div class="col-md-6 mb-3">

<label>Date of Birth</label>

<input
type="date"
class="form-control"
id="dob">

</div>

<div class="col-md-6 mb-3">

<label>Gender</label>

<select
class="form-select"
id="gender">

<option value="">Choose</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

</div>

<div class="col-md-12 mb-3">

<label>Address</label>

<textarea
class="form-control"
rows="3"
id="address"></textarea>

</div>

<div class="col-md-6 mb-3">

<label>Password</label>

<div class="input-group">

<input
type="password"
class="form-control"
id="password">

<button
class="btn btn-outline-secondary"
type="button"
id="showPassword">

<i class="bi bi-eye"></i>

</button>

</div>

<small class="text-danger" id="passwordError"></small>

</div>

<div class="col-md-6 mb-3">

<label>Confirm Password</label>

<input
type="password"
class="form-control"
id="confirmPassword">

<small class="text-danger" id="confirmError"></small>

</div>

<div class="col-md-12 mb-4">

<label>Profile Photo</label>

<input
type="file"
class="form-control"
id="photo">

</div>

<div class="col-md-12">

<button
class="btn btn-primary btn-lg w-100">

Create Account

</button>

</div>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<script src="js/register.js"></script>

</body>

</html>
